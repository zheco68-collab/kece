<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
  <title id="title">KECE system overview</title>
  <desc id="desc">The Spring Boot API persists submissions and judge jobs in MySQL. Dedicated Go workers claim leases, fetch testcase artifacts and report verdicts through an internal API. Code runs in Docker and SQL runs in a separate MySQL judge instance.</desc>
  <rect width="1280" height="520" fill="#10161d"/>
  <text x="52" y="62" fill="#f4f8fa" font-family="Arial, sans-serif" font-size="26" font-weight="700">System overview</text>
  <text x="52" y="91" fill="#9eafbd" font-family="Arial, sans-serif" font-size="16">Submission, evaluation and result flow</text>
  <path d="M52 111h1176" stroke="#35434f"/>
  <g font-family="Arial, sans-serif">
