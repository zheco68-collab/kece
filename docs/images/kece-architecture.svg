      <text x="352" y="409">MySQL</text><text x="912" y="409">Docker + MySQL</text>
    </g>
    <g fill="#adbdc9" font-size="15">
      <text x="72" y="253">Vue + TypeScript</text><text x="352" y="253">Auth, questions, exams</text><text x="632" y="253">Claim, renew, report</text><text x="912" y="253">C++, Java, Python, SQL, ArkTS</text>
      <text x="352" y="436">Submissions and judge jobs</text><text x="912" y="436">Sandbox / isolated SQL</text>
