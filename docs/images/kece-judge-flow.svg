<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="330" viewBox="0 0 1280 330" role="img" aria-labelledby="title desc">
  <title id="title">From a problem to a result</title>
  <desc id="desc">A learner selects a problem and submits an answer. The task is queued, evaluated by a judge worker, and the result is displayed.</desc>
  <rect width="1280" height="330" fill="#f5f5f4"/>
  <path d="M0 0h1280v330H0z" fill="none" stroke="#d2d4d6" stroke-width="2"/>
  <g font-family="Arial, sans-serif">
    <text x="44" y="56" font-size="14" font-weight="700" letter-spacing="2" fill="#65706d">KECE / JUDGE FLOW</text>
    <text x="44" y="96" font-size="29" font-weight="700" fill="#151718">From a problem to a result</text>
    <path d="M44 120h1192" stroke="#d2d4d6"/>
    <g fill="#ffffff" stroke="#cdd0d2">
      <rect x="44" y="155" width="216" height="127"/>
      <rect x="288" y="155" width="216" height="127"/>
      <rect x="532" y="155" width="216" height="127"/>
      <rect x="776" y="155" width="216" height="127"/>
      <rect x="1020" y="155" width="216" height="127"/>
    </g>
    <g fill="#347d60" font-size="13" font-weight="700" letter-spacing="1">
      <text x="62" y="183">01 / CHOOSE</text><text x="306" y="183">02 / SUBMIT</text>
      <text x="550" y="183">03 / QUEUE</text><text x="794" y="183">04 / JUDGE</text>
      <text x="1038" y="183">05 / REVIEW</text>
    </g>
    <g fill="#151718" font-size="21" font-weight="700">
      <text x="62" y="219">Select a problem</text><text x="306" y="219">Send an answer</text>
      <text x="550" y="219">Wait for a worker</text><text x="794" y="219">Run the evaluation</text>
      <text x="1038" y="219">View the result</text>
    </g>
    <g fill="#68716e" font-size="15">
      <text x="62" y="251">Read the task</text><text x="306" y="251">Code or SQL</text>
      <text x="550" y="251">Redis task queue</text><text x="794" y="251">Isolated execution</text>
      <text x="1038" y="251">Status and details</text>
    </g>
  </g>
  <g fill="none" stroke="#347d60" stroke-width="2">
    <path d="M260 218h26m-7-6 7 6-7 6"/><path d="M504 218h26m-7-6 7 6-7 6"/>
    <path d="M748 218h26m-7-6 7 6-7 6"/><path d="M992 218h26m-7-6 7 6-7 6"/>
  </g>
</svg>
