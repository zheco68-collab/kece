# KECE 评测机控制面内部接口 Nginx 访问控制模板
# 仅允许专池评测节点网段访问 /api/v1/internal/judgers/*，公网入口一律拒绝。

upstream kece_backend_internal {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 8443 ssl http2;
    server_name judger-control.internal.kece.local;

    # 生产环境请替换为真实内网签发证书
    ssl_certificate     /etc/nginx/ssl/judger-control.crt;
    ssl_certificate_key /etc/nginx/ssl/judger-control.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 仅允许内网专池 worker 节点子网与本机回环访问
    allow 127.0.0.1;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;

    # 限制请求体大小（结果与心跳回传不超过 4MB）
    client_max_body_size 4m;

    location ^~ /api/v1/internal/judgers/ {
        proxy_pass http://kece_backend_internal;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 领单长轮询超时需大于后端等待窗口（默认 15s）
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    35s;
        proxy_buffering       off;
    }

    location / {
        return 404;
    }
}
