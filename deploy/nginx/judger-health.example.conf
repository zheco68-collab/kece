# Install on the worker host only when its HTTPS address is registered in the control plane.
# Point the upstream at the local port assigned to this particular node.
server {
    listen 443 ssl;
    server_name python-1.example.internal;

    ssl_certificate     /etc/nginx/ssl/python-1.crt;
    ssl_certificate_key /etc/nginx/ssl/python-1.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Replace with the backend's private source IP.
    allow 10.40.0.10/32;
    deny all;

    location = /healthz {
        proxy_pass http://127.0.0.1:19091;
        proxy_connect_timeout 2s;
        proxy_read_timeout 2s;
    }

    location / {
        return 404;
    }
}
