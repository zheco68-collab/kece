name: CI

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'judger/**'
      - 'deploy/judger/**'
      - 'docs/contracts/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'judger/**'
      - 'deploy/judger/**'
      - 'docs/contracts/**'
      - '.github/workflows/**'

jobs:
  frontend:
    name: Frontend (Lint + Build + Test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test:unit -- --run

  backend:
    name: Backend (Test + Package)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      - name: Make mvnw executable
        run: chmod +x mvnw
      - run: ./mvnw -B spotless:check
      - run: ./mvnw -B test
      - run: ./mvnw -B package -DskipTests

  judger:
    name: Judger (Lint + Test + Build)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: judge-ci-test
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306/tcp
        options: --health-cmd="mysqladmin ping -h 127.0.0.1" --health-interval=5s --health-retries=20
    defaults:
      run:
        working-directory: judger
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Check gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Unformatted Go files:"
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: docker pull python:3.12-slim
      - run: go test -race -count=1 ./...
        env:
          KECE_TEST_DOCKER: '1'
          KECE_TEST_MYSQL_PORT: ${{ job.services.mysql.ports[3306] }}
          KECE_TEST_MYSQL_PASSWORD: judge-ci-test
      - run: go build -o bin/judger ./cmd/judger
